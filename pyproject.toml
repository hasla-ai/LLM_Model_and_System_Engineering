[project]
name = "llm-serve"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "accelerate==1.8.1",
    "bitsandbytes==0.46.0",
    "torch>=2.11.0",
    "transformers==4.55.0",
]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
