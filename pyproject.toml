[project]
name = "llm-serve"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "accelerate==1.14.0",
    "bitsandbytes==0.46.0",
    "datasets==3.6.0",
    "evaluate>=0.4.3,<1.0.0",
    "hf-transfer",
    "pandas",
    "peft==0.19.1",
    "pillow>=9.4.0",
    "python-mecab-ko",
    "qwen-vl-utils==0.0.14",
    "rich",
    "rouge",
    "scikit-learn>=1.3.0",
    "tensorboard",
    "torch==2.8.0",
    "torchaudio==2.8.0",
    "torchvision==0.23.0",
    "transformers==4.57.6",
    "trl==0.29.1",
    "vllm==0.11.0; sys_platform == 'linux'",
    "wandb",
    "ddgs",
    "duckduckgo-search==7.5.1",
    "langchain==1.2.14",
    "langchain-classic",
    "langchain-community==0.4.1",
    "langchain-openai==1.1.12",
    "nest-asyncio",
    "numexpr",
    "pydantic",
    "sqlalchemy",
    "tenacity",
    "yfinance",
]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
